# wrangler.toml — cf-speed-pick Worker config
#
# After editing this file:
#   1. Set the secret UUID once:  echo "$UUID" | npx wrangler secret put VLESS_UUID
#   2. Deploy:                    npx wrangler deploy
#
# UUID itself is NOT stored here — it's a Secret, set via `wrangler secret put`.

name = "cf-speed-proxy"
main = "_worker.js"
compatibility_date = "2024-09-23"

# Workers Logs — visible in CF Dashboard > Workers > Logs.
# Disable if you don't want any observability telemetry.
[observability]
enabled = true

# Plain vars (NOT secrets — these are visible in the dashboard).
# Override per-environment as needed.
[vars]
# Optional fallback IP:port used when direct connect fails.
# Examples: "1.2.3.4:443" (your VPS) or "" to disable (default).
FALLBACK_IP = ""

# Optional URL of the cf-speed-pick VPS cache root.
# Example: "https://cf-cache.example.com"  (no trailing slash)
# When set, /sub dynamically fetches colo CSVs from {UPSTREAM_CACHE_BASE}/cache/colo/{COLO}.csv
# When empty, /sub returns a static minimal list.
UPSTREAM_CACHE_BASE = ""

# Bind vless.cf.peeweecap.com to this Worker.
# When custom_domain = true, wrangler auto-creates the DNS record AND
# issues a TLS certificate. Path is not allowed (only the bare hostname).
# All subpaths under this domain route to the Worker.
[[routes]]
pattern = "vless.cf.peeweecap.com"
custom_domain = true
