name = "cf-docker-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Upstream cloudflare-docker-proxy reads CUSTOM_DOMAIN as a free global and
# builds its `routes` table as e.g. "docker." + CUSTOM_DOMAIN. Set the base
# domain once and the 8 subdomains below route via the Worker's host-header
# dispatch (routeByHosts in src/index.js).
[vars]
CUSTOM_DOMAIN = "cf.peeweecap.com"
MODE = "production"
TARGET_UPSTREAM = ""

# Bind 8 subdomains to this single Worker. CF routes are matched longest
# prefix; the Worker uses the incoming Host header to pick the upstream.
# zone_name routing (vs custom_domain = true) is the precedent set by
# cf-worker for vless.cf.peeweecap.com and avoids the WebSocket/edge quirks.
[[routes]]
pattern = "docker.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "quay.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "gcr.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "k8s-gcr.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "k8s.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "ghcr.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "cloudsmith.cf.peeweecap.com/*"
zone_name = "peeweecap.com"

[[routes]]
pattern = "ecr.cf.peeweecap.com/*"
zone_name = "peeweecap.com"
